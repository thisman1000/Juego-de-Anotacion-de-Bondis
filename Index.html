<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de anotación de colectivos!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bus-card {
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            transition: all 0.2s ease-in-out;
        }
        .bus-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans antialiased">

    <!-- Encabezado -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-md">
                    <i class="fa-solid fa-bus text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wide text-white">Juego de anotación de colectivos!</h1>
                    <p class="text-xs text-slate-400">Marca las líneas que viste pasar o en las que viajaste</p>
                </div>
            </div>

            <!-- Botones de Modo -->
            <div class="flex items-center gap-2 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800">
                <button id="btnModeRidden" onclick="setMode('ridden')" 
                    class="flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm transition-all duration-200 bg-emerald-600 text-white shadow-lg shadow-emerald-900/30">
                    <i class="fa-solid fa-circle-check text-base"></i>
                    <span>Tomado (Tilde)</span>
                </button>
                <button id="btnModeSpotted" onclick="setMode('spotted')" 
                    class="flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm transition-all duration-200 bg-slate-800 text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-circle-xmark text-base"></i>
                    <span>Visto sin viajar (Cruz)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Panel de Estadísticas y Filtros -->
        <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap items-center gap-3 text-sm">
                <span class="px-3 py-1 rounded-lg bg-emerald-950/60 text-emerald-400 border border-emerald-800/50 font-medium">
                    <i class="fa-solid fa-check text-xs mr-1"></i> Viajados: <strong id="countRidden">0</strong>
                </span>
                <span class="px-3 py-1 rounded-lg bg-rose-950/60 text-rose-400 border border-rose-800/50 font-medium">
                    <i class="fa-solid fa-xmark text-xs mr-1"></i> Solo Vistos: <strong id="countSpotted">0</strong>
                </span>
                <span class="px-3 py-1 rounded-lg bg-slate-700/60 text-slate-300 font-medium">
                    Totales: <strong id="countTotal">0</strong>
                </span>
            </div>

            <!-- Buscador y Filtro -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="renderBuses()" placeholder="Buscar línea..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <select id="filterSelect" onchange="renderBuses()" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="all">Todos</option>
                    <option value="ridden">Solo Tomados</option>
                    <option value="spotted">Solo Vistos</option>
                    <option value="none">Sin Marcar</option>
                </select>
            </div>
        </div>

        <!-- Parrilla de Colectivos -->
        <div id="busGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3">
            <!-- Se llena mediante JavaScript -->
        </div>

    </main>
