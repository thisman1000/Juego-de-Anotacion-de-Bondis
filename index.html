<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de anotación de colectivos!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Juego de anotación de colectivos!</h1>
        <div class="controls">
            <button id="btnRidden" class="btn btn-green active" onclick="setMode('ridden')">
                ✓ Colectivo Tomado (Tilde Verde)
            </button>
            <button id="btnSpotted" class="btn btn-red" onclick="setMode('spotted')">
                ✕ Visto sin viajar (Cruz Roja)
            </button>
        </div>
    </header>

    <div id="busGrid" class="bus-grid"></div>

    <script>
        let currentMode = 'ridden';
        const states = {};

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnRidden').classList.toggle('active', mode === 'ridden');
            document.getElementById('btnSpotted').classList.toggle('active', mode === 'spotted');
        }

        function toggleMark(card, number) {
            if (currentMode === 'ridden') {
                card.classList.toggle('has-ridden');
            } else {
                card.classList.toggle('has-spotted');
            }
        }

        // Cargar colectivos desde el archivo JSON
        fetch('colectivos.json')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('busGrid');
                data.forEach(bus => {
                    const card = document.createElement('div');
                    card.className = 'bus-card';
                    card.onclick = () => toggleMark(card, bus.number);

                    card.innerHTML = `
                        <div class="mark-left">✓</div>
                        <div class="mark-right">✕</div>
                        <div class="bus-cap" style="background-color: ${bus.cap}"></div>
                        <div class="bus-number" style="background-color: ${bus.bg}; color: ${bus.text}">
                            ${bus.number}
                        </div>
                    `;

                    grid.appendChild(card);
                });
            });
    </script>
</body>
</html>
